name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            # প্রজেক্ট ডিরেক্টরিতে যাও
            cd /home/deploy/apps/linkly-app
            
            # গিটহাব থেকে নতুন কোড টেনে আনো
            git pull origin main
            
            # নতুন কোড থেকে ইমেজ বিল্ড করে রান করো
            docker compose up -d --build --remove-orphans
            
            # হেলথ চেক
            echo "⏳ Waiting for services to be healthy..."
            sleep 10
            
            if ! curl -fs http://localhost:3000/health > /dev/null; then
              echo "❌ Backend unhealthy"
              exit 1
            fi
            
            if ! curl -fs http://localhost:8080 > /dev/null; then
              echo "❌ Frontend unhealthy"
              exit 1
            fi
            
            # অপ্রয়োজনীয় ইমেজ ডিলিট করো
            docker image prune -f
            
            echo "✅ Deploy successful: ${{ github.sha }}"